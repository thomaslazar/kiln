<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#E4E8E1">
<title>Kiln</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kiln">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preload" href="fonts/bricolage-grotesque-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <div class="lvl"><small>Level</small><b id="lvl">1</b><small id="chap"></small></div>
    <button class="menu" id="menuBtn" aria-label="Menu">⋯</button>
  </header>
  <div class="goal">
    <div class="goal-row"><span id="goalText"></span><span id="goalCount"></span></div>
    <div class="bar" id="bar"><i></i></div>
    <div class="gems" id="gems" hidden></div>
  </div>
  <div id="board" aria-label="Board"></div>
  <div id="tray"><div class="slot"></div><div class="slot"></div><div class="slot"></div></div>
  <p class="hint-text" id="hintText"></p>
</main>
<div id="toast"></div>
<div class="sheet" id="sheet" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h2 id="sheetTitle"></h2>
    <p id="sheetText"></p>
    <div class="preview" id="sheetExtra" hidden></div>
    <div class="btns" id="sheetBtns"></div>
  </div>
</div>
<script type="module" src="src/ui.js"></script>
</body>
</html>
